name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux Qt system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # 测试只需 GUI 核心（PySide6）+ 数据（pandas/jinja2）+ 测试工具。
          # pyqtdarktheme/qtawesome/darkdetect 仅 GUI 运行时用（有 try/except 容错），
          # 且 pyqtdarktheme 2.x 在某些 PyPI 镜像不可用，CI 不强装。
          pip install "PySide6>=6.5.0" pandas jinja2 requests pytest pytest-timeout pytest-asyncio

      - name: Run tests (Linux, offscreen Qt)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest
